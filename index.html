<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Showing</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="background">
        <video id="bg-video" autoplay muted loop playsinline></video>
    </div>


    <div class="overlay"></div>

    <div class="letterbox top"></div>
  <div class="letterbox bottom"></div>

  <main class="content">
    <p class="label">Now showing</p>
    <h1 id="title"></h1>
    <p id="quote"></p>
    <p id="details"></p>
  </main>

  <button id="next-btn">Next scene</button>

  <script>

    const backgrounds = [
  "assets/blade-runner-2049.mp4",
  "assets/fight-club.mp4",
  "assets/cyberpunk-edgerunners.mp4",
  "assets/dark-knight.mp4",
  "assets/sinners.mp4",
  "assets/Entergalactic.mp4"
    ];

    const titles = [
  "Blade Runner 2049",
  "Fight Club",
  "Cyberpunk: Edgerunners",
  "The Dark Knight",
  "Sinners",
  "Entergalactic"
    ];

    const quotes = [
  "Even something made can long to be real.",
  "Lose everything, and find out who's left.",
  "Reach for the moon, even if the city won't let you go.",
  "Some heroes are only seen in the dark.",
  "The music calls the night, and the night calls back.",
  "Love in the city feels like floating through space."
    ];

    const details = [
  "Denis Villeneuve · 2017",
  "David Fincher · 1999",
  "Hiroyuki Imaishi · 2022",
  "Christopher Nolan · 2008",
  "Ryan Coogler · 2025",
  "Fletcher Moules · 2022"
    ];



const bgVideo = document.getElementById("bg-video");
const titleText = document.getElementById("title");
const quoteText = document.getElementById("quote");
const detailsText = document.getElementById("details");

function getRandomIndex() {
  return Math.floor(Math.random() * backgrounds.length);
}

function showScene(index) {
  bgVideo.src = backgrounds[index];
  titleText.textContent = titles[index];
  quoteText.textContent = "“" + quotes[index] + "”";
  detailsText.textContent = details[index];
}

showScene(getRandomIndex());

  </script>


    
</body>
</html>
